<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EC2 Site Check — RC Design Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE7DA;
    --card:#F8F4EA;
    --ink:#211F1C;
    --ink-soft:#5B5548;
    --line:#C7BFAE;
    --steel:#2F5670;
    --steel-soft:#DCE6EA;
    --rust:#A8412A;
    --rust-soft:#F3DFD8;
    --brass:#9C7A3F;
    --focus:#2F5670;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --paper:#171B1F;
      --card:#1E2328;
      --ink:#EAE4D6;
      --ink-soft:#A79E8C;
      --line:#3A4046;
      --steel:#7FAAC4;
      --steel-soft:#233542;
      --rust:#E07C5C;
      --rust-soft:#3A241E;
      --brass:#C7A05C;
      --focus:#7FAAC4;
    }
  }
  :root[data-theme="dark"]{
    --paper:#171B1F;
    --card:#1E2328;
    --ink:#EAE4D6;
    --ink-soft:#A79E8C;
    --line:#3A4046;
    --steel:#7FAAC4;
    --steel-soft:#233542;
    --rust:#E07C5C;
    --rust-soft:#3A241E;
    --brass:#C7A05C;
    --focus:#7FAAC4;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Spectral', Georgia, 'Times New Roman', serif;}

  .app{
    width:100%;
    max-width:520px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:0 0 32px;
  }

  header.top{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--line);
  }
  header.top .brand{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
  }
  header.top h1{
    font-size:1.28rem;
    font-weight:600;
    margin:0;
    letter-spacing:0.01em;
  }
  header.top .rev{
    font-size:0.72rem;
    color:var(--ink-soft);
    border:1px solid var(--line);
    padding:2px 7px;
    white-space:nowrap;
  }
  header.top p{
    margin:6px 0 0;
    font-size:0.86rem;
    color:var(--ink-soft);
  }

  main{flex:1; display:flex; flex-direction:column; padding:20px;}

  /* ---- Home screen ---- */
  .modules{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
  .module-row{
    border:1px solid var(--line);
    background:var(--card);
    padding:14px 14px;
    display:flex;
    align-items:center;
    gap:14px;
    cursor:pointer;
    transition:border-color .15s ease;
  }
  .module-row:hover{border-color:var(--steel);}
  .module-row.selected{border-color:var(--steel); box-shadow: inset 0 0 0 1px var(--steel);}
  .module-row input{accent-color:var(--steel); width:17px; height:17px; flex:none;}
  .module-row .m-num{
    font-family:'Spectral', serif;
    font-size:1.4rem;
    font-weight:600;
    color:var(--steel);
    width:28px;
    flex:none;
    text-align:center;
  }
  .module-row .m-text{flex:1; min-width:0;}
  .module-row .m-title{font-weight:600; font-size:0.98rem;}
  .module-row .m-sub{font-size:0.8rem; color:var(--ink-soft); margin-top:2px;}
  .module-row .m-best{font-size:0.76rem; color:var(--brass); margin-top:4px; font-weight:500;}

  .count-row{
    display:flex; align-items:center; justify-content:space-between;
    margin:22px 0 4px; font-size:0.86rem; color:var(--ink-soft);
  }
  .stepper{display:flex; align-items:center; gap:10px;}
  .stepper button{
    width:30px; height:30px; border:1px solid var(--line); background:var(--card);
    color:var(--ink); font-size:1rem; cursor:pointer;
  }
  .stepper span{min-width:22px; text-align:center; font-weight:600; color:var(--ink);}

  .btn{
    appearance:none; border:none; cursor:pointer;
    font-family:'IBM Plex Sans', sans-serif; font-weight:600; font-size:0.95rem;
    padding:14px 20px;
    background:var(--steel); color:var(--paper);
    letter-spacing:0.01em;
  }
  .btn:disabled{opacity:0.4; cursor:default;}
  .btn.block{width:100%; margin-top:18px;}
  .btn.ghost{background:transparent; color:var(--steel); border:1px solid var(--steel);}
  .btn:focus-visible, .module-row:focus-visible, .opt:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}

  .hint{font-size:0.78rem; color:var(--ink-soft); margin-top:10px; line-height:1.5;}

  /* ---- Quiz screen ---- */
  .track{
    display:flex; gap:3px; margin-bottom:18px;
  }
  .tick{
    flex:1; height:6px; background:var(--line);
  }
  .tick.correct{background:var(--steel);}
  .tick.wrong{background:var(--rust);}
  .tick.current{background:var(--brass);}

  .q-meta{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:0.76rem; color:var(--ink-soft); margin-bottom:10px;
  }
  .q-meta .ref{font-variant-numeric: tabular-nums;}

  .q-text{
    font-size:1.18rem; line-height:1.45; font-weight:600; margin:0 0 20px;
  }

  .options{display:flex; flex-direction:column; gap:0; border-top:1px solid var(--line);}
  .opt{
    display:flex; align-items:flex-start; gap:12px;
    padding:14px 4px;
    border-bottom:1px solid var(--line);
    background:transparent;
    text-align:left;
    cursor:pointer;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.95rem;
    color:var(--ink);
    width:100%;
  }
  .opt .letter{
    flex:none; width:26px; height:26px;
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size:0.8rem; font-weight:600; color:var(--ink-soft);
    margin-top:1px;
  }
  .opt .label{flex:1; padding-top:2px; line-height:1.4;}
  .opt.correct{background:var(--steel-soft);}
  .opt.correct .letter{background:var(--steel); color:var(--paper); border-color:var(--steel);}
  .opt.wrong{background:var(--rust-soft);}
  .opt.wrong .letter{background:var(--rust); color:var(--paper); border-color:var(--rust);}
  .opt.disabled{cursor:default;}

  .feedback{
    margin-top:16px; padding:12px 14px;
    border-left:3px solid var(--line);
    font-size:0.86rem; line-height:1.5; color:var(--ink-soft);
    display:none;
  }
  .feedback.show{display:block;}
  .feedback.right{border-color:var(--steel);}
  .feedback.miss{border-color:var(--rust);}
  .feedback b{color:var(--ink); font-weight:600;}

  .quiz-footer{margin-top:auto; padding-top:24px;}

  /* ---- Results screen ---- */
  .score-big{
    font-family:'Spectral', serif; font-weight:700;
    font-size:3rem; line-height:1; margin:18px 0 4px;
  }
  .score-label{font-size:0.9rem; color:var(--ink-soft);}
  .breakdown{margin:22px 0; border-top:1px solid var(--line);}
  .b-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 0; border-bottom:1px solid var(--line); font-size:0.9rem;
  }
  .b-row .b-name{color:var(--ink-soft);}
  .b-row .b-score{font-weight:600; font-variant-numeric: tabular-nums;}
  .row-2{display:flex; gap:10px; margin-top:8px;}
  .row-2 .btn{flex:1;}

  .badge-best{
    display:inline-block; margin-top:10px; font-size:0.78rem; color:var(--brass); font-weight:500;
  }

  .hidden{display:none !important;}

  ::selection{background:var(--steel); color:var(--paper);}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand">
      <h1>EC2 Site Check</h1>
      <span class="rev">Rev 1</span>
    </div>
    <p>Multiple-choice review — Modules 1&ndash;3</p>
  </header>

  <main>

    <!-- HOME -->
    <section id="screen-home">
      <div class="modules" id="module-list"></div>

      <div class="count-row">
        <span id="count-label">10 questions</span>
        <div class="stepper">
          <button id="dec" aria-label="Fewer questions">&minus;</button>
          <span id="count-val">10</span>
          <button id="inc" aria-label="More questions">&plus;</button>
        </div>
      </div>

      <button class="btn block" id="start-btn">Begin</button>
      <p class="hint" id="pool-hint"></p>
    </section>

    <!-- QUIZ -->
    <section id="screen-quiz" class="hidden">
      <div class="track" id="track"></div>
      <div class="q-meta">
        <span id="q-module"></span>
        <span class="ref" id="q-ref"></span>
      </div>
      <p class="q-text" id="q-text"></p>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="quiz-footer">
        <button class="btn block" id="next-btn" disabled>Next</button>
      </div>
    </section>

    <!-- RESULTS -->
    <section id="screen-results" class="hidden">
      <h2 class="serif" style="font-size:1.1rem; font-weight:600; margin-bottom:0;">Result</h2>
      <div class="score-big" id="score-big">0/0</div>
      <div class="score-label" id="score-pct"></div>
      <div id="best-badge" class="badge-best hidden"></div>

      <div class="breakdown" id="breakdown"></div>

      <div class="row-2">
        <button class="btn ghost" id="retry-btn">Retry set</button>
        <button class="btn" id="home-btn">Choose modules</button>
      </div>
    </section>

  </main>
</div>

<script>
(function(){

  var MODULES = {
    m1: { key:'m1', num:'1', title:'Foundations of the Code', sub:'EN 1990 basis, materials, partial factors, exposure & cover' },
    m2: { key:'m2', num:'2', title:'Structural Analysis Basics', sub:'Imperfections, second-order effects, actions from EN 1991' },
    m3: { key:'m3', num:'3', title:'ULS: Bending and Shear', sub:'Section 6.1 bending, 6.2 shear, 6.3 torsion' },
    m4: { key:'m4', num:'4', title:'Slabs', sub:'One-way/two-way behaviour, detailing, punching shear, deflection' },
    m5: { key:'m5', num:'5', title:'Beams', sub:'Curtailment, shear links, deep beams and strut-and-tie' },
    m6: { key:'m6', num:'6', title:'Columns and Piers', sub:'Slenderness, biaxial bending, detailing, bridge piers' },
    m7: { key:'m7', num:'7', title:'Retaining Walls', sub:'Wall detailing, geotechnical actions, crack control, stability' },
    m8: { key:'m8', num:'8', title:'Serviceability & Detailing', sub:'Stress limitation, crack control, anchorage/laps, tying systems' }
  };

  var BANK = [
    // ---- Module 1 ----
    {m:'m1', ref:'EN 1990, Table 2.1', q:'Under EN 1990, what indicative design working life is assigned to bridges and other civil engineering structures (Category 5)?',
      opts:['10 years','50 years','100 years','120 years'], correct:2,
      note:'Category 5 (monumental buildings, bridges and other civil engineering structures) carries an indicative design working life of 100 years.'},
    {m:'m1', ref:'EN 1992-1-1, Table 2.1N', q:'What is the recommended partial factor \u03B3C for concrete in persistent and transient design situations?',
      opts:['1.15','1.5','1.2','1.0'], correct:1,
      note:'\u03B3C = 1.5 for persistent/transient situations (reduced to 1.2 for accidental situations).'},
    {m:'m1', ref:'EN 1992-1-1, Table 2.1N', q:'What is the recommended partial factor \u03B3S for reinforcing steel in persistent and transient design situations?',
      opts:['1.0','1.15','1.5','1.2'], correct:1,
      note:'\u03B3S = 1.15 for persistent/transient situations (reduced to 1.0 for accidental situations).'},
    {m:'m1', ref:'EN 1992-1-1, Table 2.1N', q:'For accidental design situations, which pair of material partial factors applies?',
      opts:['\u03B3C = 1.5, \u03B3S = 1.15','\u03B3C = 1.2, \u03B3S = 1.0','\u03B3C = 1.0, \u03B3S = 1.0','\u03B3C = 1.35, \u03B3S = 1.05'], correct:1,
      note:'The accidental case relaxes the factors to \u03B3C = 1.2 and \u03B3S = 1.0.'},
    {m:'m1', ref:'EN 1992-1-1, \u00A73.1.6', q:'The design compressive strength is fcd = \u03B1cc\u00B7fck/\u03B3C. What does \u03B1cc primarily account for?',
      opts:['Variability of the material only','Long-term effects on compressive strength and unfavourable effects from the way the load is applied','The ductility class of the reinforcement','The exposure class of the concrete'], correct:1,
      note:'\u03B1cc is a coefficient covering long-term and loading-rate effects, distinct from the material partial factor \u03B3C.'},
    {m:'m1', ref:'EN 1992-1-1, Table 4.1', q:'Which exposure class describes reinforcement at risk of carbonation-induced corrosion under cyclic wet and dry conditions?',
      opts:['XC1','XC2','XC3','XC4'], correct:3,
      note:'XC4 covers cyclic wet and dry exposure — the most severe of the carbonation classes.'},
    {m:'m1', ref:'EN 1992-1-1, Table 4.1', q:'Which exposure class family covers corrosion induced by chlorides from sea water?',
      opts:['XD','XS','XF','XA'], correct:1,
      note:'XS covers marine/sea-water chloride exposure; XD covers chlorides from sources other than sea water, such as de-icing salts.'},
    {m:'m1', ref:'EN 1992-1-1, \u00A74.4.1', q:'What does the minimum cover component cmin,b primarily ensure?',
      opts:['Fire resistance','Adequate bond and transmission of forces between reinforcement and concrete','Freeze-thaw resistance','Resistance to chemical attack'], correct:1,
      note:'cmin,b is the bond requirement; durability and fire each have their own minimum-cover checks that are combined to find the governing value.'},
    {m:'m1', ref:'EN 1992-1-1, \u00A74.4.1.3', q:'Nominal cover is calculated as cnom = cmin + \u0394cdev. What does \u0394cdev represent?',
      opts:['An allowance for construction deviation','An additional fire safety margin','A durability safety margin on top of cmin,dur','The bond length allowance'], correct:0,
      note:'\u0394cdev is an execution tolerance allowing for deviations in reinforcement placement on site.'},
    {m:'m1', ref:'EN 1992-1-1, \u00A73.1.7', q:'In the parabola-rectangle stress-strain model for concrete (fck \u2264 50 MPa), what is the ultimate compressive strain \u03B5cu2?',
      opts:['0.0020','0.0035','0.0050','0.0100'], correct:1,
      note:'\u03B5cu2 = 0.0035 for normal-strength concrete; the strain at peak stress \u03B5c2 is 0.0020.'},
    {m:'m1', ref:'EN 1992-1-1, \u00A73.2.7', q:'Design yield strength of reinforcement is calculated as:',
      opts:['fyd = fyk \u00D7 \u03B3S','fyd = fyk / \u03B3S','fyd = fyk \u00D7 \u03B1cc / \u03B3S','fyd = fyk / \u03B3C'], correct:1,
      note:'fyd = fyk / \u03B3S, mirroring the concrete relationship fcd = \u03B1cc\u00B7fck/\u03B3C.'},
    {m:'m1', ref:'EN 1992-3', q:'Which Eurocode 2 part gives design rules for liquid-retaining and containment structures, including crack control under restrained or imposed deformation?',
      opts:['EN 1992-2','EN 1992-3','EN 1992-1-2','EN 1990'], correct:1,
      note:'EN 1992-3 covers liquid-retaining and containment structures; EN 1992-2 is the bridges part and EN 1992-1-2 covers fire design.'},

    // ---- Module 2 ----
    {m:'m2', ref:'EN 1992-1-1, \u00A75.2', q:'Which clause of EN 1992-1-1 deals with geometric imperfections in structural analysis?',
      opts:['\u00A75.2','\u00A75.8','\u00A76.1','\u00A79.5'], correct:0,
      note:'Clause 5.2 sets out how imperfections (out-of-plumb, etc.) are represented in analysis, typically as an equivalent inclination or eccentricity.'},
    {m:'m2', ref:'EN 1992-1-1, \u00A75.2(5)', q:'The recommended basic value of the inclination \u03B80 used to represent imperfections is:',
      opts:['1/100','1/200','1/300','1/400'], correct:1,
      note:'\u03B80 = 1/200 is the recommended basic value, subsequently modified by \u03B1h and \u03B1m.'},
    {m:'m2', ref:'EN 1992-1-1, \u00A75.2(5)', q:'The length-reduction factor \u03B1h = 2/\u221Al is bounded within which limits?',
      opts:['1/3 and 1','2/3 and 1','1/2 and 2','1 and 2'], correct:1,
      note:'\u03B1h is limited to 2/3 \u2264 \u03B1h \u2264 1, so very short or very long members don\u2019t get an unrealistic multiplier.'},
    {m:'m2', ref:'EN 1991-1-4', q:'Which loading Eurocode covers wind actions, relevant to the design of slender bridge piers?',
      opts:['EN 1991-1-1','EN 1991-1-4','EN 1991-1-5','EN 1991-1-7'], correct:1,
      note:'EN 1991-1-4 is the wind actions part of the loading suite.'},
    {m:'m2', ref:'EN 1991-1-5', q:'Which loading Eurocode covers thermal actions, relevant to retaining walls and bridge piers/decks?',
      opts:['EN 1991-1-1','EN 1991-1-4','EN 1991-1-5','EN 1991-2'], correct:2,
      note:'EN 1991-1-5 deals with thermal actions, including temperature differentials through bridge decks.'},
    {m:'m2', ref:'EN 1991-2', q:'Traffic loading on bridge decks and the piers that support them is defined in which Eurocode part?',
      opts:['EN 1991-1-1','EN 1991-1-7','EN 1991-2','EN 1990'], correct:2,
      note:'EN 1991-2 is dedicated to traffic loads on bridges (road, footway and rail).'},
    {m:'m2', ref:'EN 1992-1-1, \u00A75.4\u20135.7', q:'Which of the following is NOT one of the ULS analysis methods set out in Section 5 of EN 1992-1-1?',
      opts:['Linear elastic analysis','Linear elastic analysis with limited redistribution','Plastic analysis','Reliability-based probabilistic analysis'], correct:3,
      note:'Section 5 covers linear elastic, linear elastic with limited redistribution, plastic and non-linear analysis \u2014 reliability-based methods sit outside the standard partial-factor approach.'},
    {m:'m2', ref:'EN 1992-1-1, \u00A75.8.3.1', q:'Second-order effects on a member may generally be ignored if its slenderness is:',
      opts:['Above the slenderness limit \u03BBlim','Below the slenderness limit \u03BBlim','Equal to zero','Equal to the effective length'], correct:1,
      note:'If \u03BB < \u03BBlim, second-order effects are considered negligible and a first-order analysis is sufficient.'},
    {m:'m2', ref:'EN 1992-1-1, \u00A75.8.3.2', q:'For a cantilever column (fixed at the base, free at the top), the effective length l0 is approximately:',
      opts:['0.5l','0.7l','l','2l'], correct:3,
      note:'A cantilever behaves like half of a pin-ended member of twice the length, giving l0 \u2248 2l.'},
    {m:'m2', ref:'EN 1990, \u00A76.4.3', q:'Which combination expression in EN 1990 is commonly used for the ULS persistent/transient design situation?',
      opts:['Expression 6.10 (or 6.10a/6.10b)','Expression 6.4','Expression 6.8','Expression 6.14'], correct:0,
      note:'Expression 6.10, or the less conservative pair 6.10a/6.10b, covers persistent and transient design situations.'},
    {m:'m2', ref:'EN 1991-1-7', q:'Accidental actions such as vehicle impact on a structure are covered under which loading Eurocode?',
      opts:['EN 1991-1-1','EN 1991-1-5','EN 1991-1-7','EN 1991-2'], correct:2,
      note:'EN 1991-1-7 covers accidental actions from impact and explosions.'},
    {m:'m2', ref:'EN 1991-1-1', q:'Self-weight and imposed (occupancy/use) loads for general structures are defined in:',
      opts:['EN 1991-1-1','EN 1991-1-4','EN 1991-1-5','EN 1991-2'], correct:0,
      note:'EN 1991-1-1 covers densities, self-weight and imposed loads for buildings and general structures.'},

    // ---- Module 3 ----
    {m:'m3', ref:'EN 1992-1-1, \u00A76.1', q:'Which section of EN 1992-1-1 covers bending, with or without axial force, at ULS?',
      opts:['6.1','6.2','6.3','6.4'], correct:0,
      note:'Section 6.1 is the base tool used for beams, slabs, walls and columns/piers under bending and axial load.'},
    {m:'m3', ref:'EN 1992-1-1, \u00A76.2', q:'Which section of EN 1992-1-1 covers shear resistance at ULS?',
      opts:['6.1','6.2','6.3','6.4'], correct:1,
      note:'Section 6.2 covers beam shear; punching shear for slabs is treated separately in Section 6.4.'},
    {m:'m3', ref:'EN 1992-1-1, \u00A76.3', q:'Which section of EN 1992-1-1 covers torsion?',
      opts:['6.1','6.2','6.3','6.4'], correct:2,
      note:'Section 6.3 covers torsion, generally a lower priority except where equilibrium torsion governs.'},
    {m:'m3', ref:'EN 1992-1-1, \u00A76.1(2)', q:'A fundamental assumption of the bending design method in Section 6.1 is that:',
      opts:['Concrete carries tension across cracks','Plane sections remain plane','Reinforcement remains elastic to failure','Shear and bending are always independent of one another'], correct:1,
      note:'The plane-sections-remain-plane assumption underlies the strain compatibility used to derive the stress block.'},
    {m:'m3', ref:'EN 1992-1-1, \u00A76.2.2', q:'In the shear resistance expression VRd,c, the recommended value of the coefficient CRd,c is:',
      opts:['0.12','0.15/\u03B3C','0.18/\u03B3C','0.20/\u03B3C'], correct:2,
      note:'CRd,c = 0.18/\u03B3C is the recommended value in the concrete-only shear resistance formula.'},
    {m:'m3', ref:'EN 1992-1-1, \u00A76.2.2', q:'The size-effect factor k = 1 + \u221A(200/d) in the VRd,c expression is subject to an upper limit of:',
      opts:['1.5','2.0','2.5','3.0'], correct:1,
      note:'k is capped at 2.0 (reached when d \u2264 200 mm), reflecting the reduced benefit of the size effect in shallow members.'},
    {m:'m3', ref:'UK NA to EN 1992-1-1, \u00A76.2.3', q:'For members requiring shear reinforcement, the variable strut inclination method lets the designer choose cot \u03B8 within a range. Per the UK National Annex, this range is:',
      opts:['0.5 to 1.0','1.0 to 2.0','1.0 to 2.5','1.5 to 3.0'], correct:2,
      note:'The UK NA permits 1.0 \u2264 cot \u03B8 \u2264 2.5, i.e. a strut angle between 21.8\u00B0 and 45\u00B0.'},
    {m:'m3', ref:'Trigonometry check', q:'A strut angle \u03B8 of 45\u00B0 corresponds to a cot \u03B8 value of:',
      opts:['0.5','1.0','1.5','2.0'], correct:1,
      note:'cot 45\u00B0 = 1.0 \u2014 the steepest strut angle normally used in design.'},

  var state = { mods:['m1'], count:10, queue:[], idx:0, correctCount:0, perModule:{}, answered:false };

  function shuffled(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  function bestKey(mods){
    return 'ec2quiz-best-' + mods.slice().sort().join('-');
  }
  function getBest(mods){
    try{
      var v = localStorage.getItem(bestKey(mods));
      return v ? JSON.parse(v) : null;
    }catch(e){ return null; }
  }
  function setBest(mods, correct, total){
    try{
      var cur = getBest(mods);
      var pct = correct/total;
      if(!cur || pct > cur.correct/cur.total || (pct === cur.correct/cur.total && total > cur.total)){
        localStorage.setItem(bestKey(mods), JSON.stringify({correct:correct, total:total}));
        return true;
      }
    }catch(e){}
    return false;
  }

  // ---------- render home ----------
  var moduleListEl = document.getElementById('module-list');

  function renderHome(){
    moduleListEl.innerHTML = '';
    Object.keys(MODULES).forEach(function(key){
      var mod = MODULES[key];
      var row = document.createElement('label');
      row.className = 'module-row' + (state.mods.indexOf(key) > -1 ? ' selected' : '');
      row.setAttribute('tabindex','0');

      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = state.mods.indexOf(key) > -1;
      cb.addEventListener('change', function(){
        toggleModule(key);
      });

      var numEl = document.createElement('div');
      numEl.className = 'm-num';
      numEl.textContent = mod.num;

      var textEl = document.createElement('div');
      textEl.className = 'm-text';
      var t = document.createElement('div'); t.className='m-title'; t.textContent = mod.title;
      var s = document.createElement('div'); s.className='m-sub'; s.textContent = mod.sub;
      textEl.appendChild(t); textEl.appendChild(s);

      var best = getBest([key]);
      if(best){
        var b = document.createElement('div');
        b.className = 'm-best';
        b.textContent = 'Best: ' + best.correct + '/' + best.total;
        textEl.appendChild(b);
      }

      row.appendChild(cb);
      row.appendChild(numEl);
      row.appendChild(textEl);
      moduleListEl.appendChild(row);
    });
    updatePoolHint();
    updateCountBounds();
  }

  function toggleModule(key){
    var i = state.mods.indexOf(key);
    if(i > -1){
      if(state.mods.length > 1){ state.mods.splice(i,1); }
    } else {
      state.mods.push(key);
    }
    renderHome();
  }

  function poolFor(mods){
    return BANK.filter(function(q){ return mods.indexOf(q.m) > -1; });
  }

  function updatePoolHint(){
    var pool = poolFor(state.mods);
    document.getElementById('pool-hint').textContent =
      pool.length + ' questions available in the selected module' + (state.mods.length>1?'s':'') + '. Options are reshuffled each attempt.';
  }

  function updateCountBounds(){
    var pool = poolFor(state.mods);
    var max = pool.length;
    if(state.count > max) state.count = max;
    if(state.count < 1) state.count = Math.min(5, max);
    document.getElementById('count-val').textContent = state.count;
    document.getElementById('count-label').textContent = state.count + (state.count===1?' question':' questions');
  }

  document.getElementById('dec').addEventListener('click', function(){
    state.count = Math.max(3, state.count - 1);
    updateCountBounds();
  });
  document.getElementById('inc').addEventListener('click', function(){
    var max = poolFor(state.mods).length;
    state.count = Math.min(max, state.count + 1);
    updateCountBounds();
  });

  document.getElementById('start-btn').addEventListener('click', startQuiz);

  // ---------- quiz flow ----------
  var screenHome = document.getElementById('screen-home');
  var screenQuiz = document.getElementById('screen-quiz');
  var screenResults = document.getElementById('screen-results');

  function startQuiz(){
    var pool = shuffled(poolFor(state.mods));
    state.queue = pool.slice(0, state.count).map(function(q){
      var order = shuffled(q.opts.map(function(o,i){ return i; }));
      return {
        m:q.m, ref:q.ref, q:q.q, note:q.note,
        opts: order.map(function(i){ return q.opts[i]; }),
        correctIdx: order.indexOf(q.correct)
      };
    });
    state.idx = 0;
    state.correctCount = 0;
    state.perModule = {};
    state.mods.forEach(function(m){ state.perModule[m] = {correct:0,total:0}; });

    screenHome.classList.add('hidden');
    screenResults.classList.add('hidden');
    screenQuiz.classList.remove('hidden');
    renderTrack();
    renderQuestion();
  }

  function renderTrack(){
    var track = document.getElementById('track');
    track.innerHTML = '';
    state.queue.forEach(function(item, i){
      var t = document.createElement('div');
      t.className = 'tick';
      if(item.result === 'correct') t.className += ' correct';
      else if(item.result === 'wrong') t.className += ' wrong';
      else if(i === state.idx) t.className += ' current';
      track.appendChild(t);
    });
  }

  function renderQuestion(){
    var item = state.queue[state.idx];
    state.answered = false;
    document.getElementById('q-module').textContent = 'Module ' + MODULES[item.m].num + ' \u00B7 Q' + (state.idx+1) + '/' + state.queue.length;
    document.getElementById('q-ref').textContent = item.ref;
    document.getElementById('q-text').textContent = item.q;

    var optsEl = document.getElementById('options');
    optsEl.innerHTML = '';
    var letters = ['A','B','C','D'];
    item.opts.forEach(function(opt, i){
      var btn = document.createElement('button');
      btn.className = 'opt';
      btn.type = 'button';
      var l = document.createElement('span'); l.className='letter'; l.textContent = letters[i];
      var lab = document.createElement('span'); lab.className='label'; lab.textContent = opt;
      btn.appendChild(l); btn.appendChild(lab);
      btn.addEventListener('click', function(){ selectAnswer(i); });
      optsEl.appendChild(btn);
    });

    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').textContent = '';
    document.getElementById('next-btn').disabled = true;
    document.getElementById('next-btn').textContent = (state.idx === state.queue.length-1) ? 'See result' : 'Next';
    renderTrack();
  }

  function selectAnswer(i){
    if(state.answered) return;
    state.answered = true;
    var item = state.queue[state.idx];
    var isRight = (i === item.correctIdx);
    item.result = isRight ? 'correct' : 'wrong';

    if(isRight){
      state.correctCount++;
    }
    state.perModule[item.m].total++;
    if(isRight) state.perModule[item.m].correct++;

    var opts = document.querySelectorAll('.opt');
    opts.forEach(function(btn, idx){
      btn.classList.add('disabled');
      btn.disabled = true;
      if(idx === item.correctIdx) btn.classList.add('correct');
      if(idx === i && !isRight) btn.classList.add('wrong');
    });

    var fb = document.getElementById('feedback');
    fb.className = 'feedback show ' + (isRight ? 'right' : 'miss');
    fb.innerHTML = '<b>' + (isRight ? 'Correct.' : 'Not quite.') + '</b> ' + item.note;

    document.getElementById('next-btn').disabled = false;
    renderTrack();
  }

  document.getElementById('next-btn').addEventListener('click', function(){
    if(state.idx < state.queue.length - 1){
      state.idx++;
      renderQuestion();
    } else {
      showResults();
    }
  });

  function showResults(){
    screenQuiz.classList.add('hidden');
    screenResults.classList.remove('hidden');

    var total = state.queue.length;
    document.getElementById('score-big').textContent = state.correctCount + '/' + total;
    document.getElementById('score-pct').textContent = Math.round(100*state.correctCount/total) + '% correct';

    var isNewBest = setBest(state.mods, state.correctCount, total);
    if(state.mods.length === 1) isNewBest = setBest([state.mods[0]], state.perModule[state.mods[0]].correct, state.perModule[state.mods[0]].total) || isNewBest;
    var bestBadge = document.getElementById('best-badge');
    if(isNewBest){
      bestBadge.classList.remove('hidden');
      bestBadge.textContent = 'New best for this set.';
    } else {
      bestBadge.classList.add('hidden');
    }

    var bd = document.getElementById('breakdown');
    bd.innerHTML = '';
    state.mods.forEach(function(m){
      var s = state.perModule[m];
      if(!s || s.total === 0) return;
      var row = document.createElement('div');
      row.className = 'b-row';
      row.innerHTML = '<span class="b-name">Module ' + MODULES[m].num + ' \u2014 ' + MODULES[m].title + '</span><span class="b-score">' + s.correct + '/' + s.total + '</span>';
      bd.appendChild(row);
    });
  }

  document.getElementById('retry-btn').addEventListener('click', startQuiz);
  document.getElementById('home-btn').addEventListener('click', function(){
    screenResults.classList.add('hidden');
    screenQuiz.classList.add('hidden');
    screenHome.classList.remove('hidden');
    renderHome();
  });

  renderHome();
})();
</script>
</body>
</html>
